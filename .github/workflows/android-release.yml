name: Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate project
        run: |
          npm run typecheck
          npm run lint
          npm test -- --runInBand

      - name: Generate native Android project
        run: npx expo prebuild --no-install

      - name: Build signed release APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a -p android assembleRelease

      - name: Prepare release metadata
        id: metadata
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          APK_NAME="linknest-${VERSION}-build-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linknest-apk-${{ steps.metadata.outputs.version }}-${{ github.run_number }}
          path: ${{ steps.metadata.outputs.apk_name }}
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.metadata.outputs.apk_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          TAG="v${VERSION}-build-${GITHUB_RUN_NUMBER}"
          TITLE="LinkNest ${VERSION} · build ${GITHUB_RUN_NUMBER}"
          NOTES="APK instalable de LinkNest generado automáticamente desde ${GITHUB_SHA}."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
